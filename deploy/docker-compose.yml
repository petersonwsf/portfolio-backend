# Exemplo para o diretório de deploy na VPS (o workflow executa `docker compose pull <serviço> && up -d <serviço>` aqui; a tag é o nome da branch).
services:
  backend:
    image: ghcr.io/<usuario>/<repositorio-backend>:main
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: .env
    ports:
      # publicado só em localhost: o Caddy da VPS faz o reverse_proxy para esta porta.
      # (se o seu Caddy roda em container, troque por uma rede Docker compartilhada)
      - "127.0.0.1:3333:3333"
