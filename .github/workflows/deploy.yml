name: Deploy API

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  deploy_ghcr:
    runs-on: ubuntu-latest
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
    - uses: actions/checkout@v4

    - name: Nome da imagem (GHCR exige minúsculas)
      id: nome
      run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker login (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.nome.outputs.imagem }}:${{ github.ref_name }}

  deploy_vps:
    runs-on: ubuntu-latest
    needs: deploy_ghcr
    steps:
    - name: Atualizar container na VPS
      uses: appleboy/ssh-action@v1.2.0
      env:
        GHCR_USUARIO: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script_stop: true
        envs: GHCR_USUARIO,GHCR_TOKEN
        script: |
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          cd ${{ secrets.VPS_PROJECT_PATH }}
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USUARIO" --password-stdin
          docker compose pull backend
          docker compose up -d backend
          docker image prune -f
