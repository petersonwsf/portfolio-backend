name: Deploy (backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

# evita dois deploys simultâneos do mesmo serviço
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRO: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparar acesso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar container na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DIRETORIO: ${{ secrets.VPS_DIRETORIO }}
          GHCR_USUARIO: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # o token vai pela entrada padrão (não aparece em argumentos nem em logs)
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -e; \
             trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT; \
             cd '$VPS_DIRETORIO'; \
             docker login ${{ env.REGISTRO }} -u '$GHCR_USUARIO' --password-stdin; \
             docker compose pull; \
             docker compose up -d --remove-orphans; \
             docker image prune -f"
